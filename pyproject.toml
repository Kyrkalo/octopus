[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "octopus"
version = "0.1.0"
description = "Reusable, config-driven ML-ops engine for PyTorch training pipelines"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
keywords = ["machine-learning", "deep-learning", "pytorch", "mlops"]
authors = [
    {name = "Roman Kyrkalo"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "anyio",
    "pycocotools",
]

[project.optional-dependencies]
gpt = [
    "tqdm",
]
dev = [
    "pytest",
]

[project.urls]
Homepage = "https://github.com/Kyrkalo/octopus"
Repository = "https://github.com/Kyrkalo/octopus"
Issues = "https://github.com/Kyrkalo/octopus/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["octopus*"]

[tool.setuptools.package-data]
octopus = ["configs.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
